      <!-- Inner Capsule Body -->
      <path transform="rotate(-45)" fill="#ffffff" d="M -52 -48 A 52 52 0 0 1 52 -48 L 52 48 A 52 52 0 0 1 -52 48 Z"/>
      <!-- Diagonal Slash Bar -->
      <path transform="rotate(45)" fill="#ffffff" d="M -110 -15 L 110 -15 A 15 15 0 0 1 125 0 A 15 15 0 0 1 110 15 L -110 15 A 15 15 0 0 1 -125 0 A 15 15 0 0 1 -110 -15 Z"/>
    </g>
  </g>
</g></svg>